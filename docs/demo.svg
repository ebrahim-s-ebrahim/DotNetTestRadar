<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
  <defs>
    <style>
      text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    </style>
  </defs>

  <!-- Border -->
  <rect fill="#30363d" width="900" height="330" rx="8"/>
  <!-- Background -->
  <rect fill="#0d1117" x="1" y="1" width="898" height="328" rx="7"/>

  <!-- Title bar -->
  <rect fill="#010409" x="1" y="1" width="898" height="33" rx="7"/>
  <rect fill="#010409" x="1" y="20" width="898" height="14"/>
  <circle fill="#ff5f56" cx="20" cy="17" r="6"/>
  <circle fill="#ffbd2e" cx="38" cy="17" r="6"/>
  <circle fill="#27c93f" cx="56" cy="17" r="6"/>
  <text fill="#7d8590" font-size="11.5" x="450" y="22" text-anchor="middle">dotnet-litmus</text>

  <!-- Command -->
  <text fill="#3fb950" font-size="13" x="22" y="56">$</text>
  <text fill="#e6edf3" font-size="13" x="36" y="56">dotnet-litmus scan --top 4</text>

  <!-- ── Act Now ── -->
  <text fill="#58a6ff" font-size="12" font-weight="600" x="22" y="82">── Act Now</text>
  <line x1="114" y1="78" x2="878" y2="78" stroke="#21262d" stroke-width="1"/>

  <!-- Column headers -->
  <text fill="#7d8590" font-size="11" x="22" y="102">Rank</text>
  <text fill="#7d8590" font-size="11" x="66" y="102">File</text>
  <text fill="#7d8590" font-size="11" x="330" y="102">Commits</text>
  <text fill="#7d8590" font-size="11" x="406" y="102">Coverage</text>
  <text fill="#7d8590" font-size="11" x="488" y="102">Complexity</text>
  <text fill="#7d8590" font-size="11" x="586" y="102">Coupling</text>
  <text fill="#7d8590" font-size="11" x="672" y="102">Risk</text>
  <text fill="#7d8590" font-size="11" x="740" y="102">Priority</text>

  <!-- Row 1: High Priority -->
  <rect fill="#ff7b7208" x="14" y="108" width="872" height="20" rx="2"/>
  <text fill="#ff7b72" font-size="12" x="28" y="122">1</text>
  <text fill="#ff7b72" font-size="12" x="66" y="122">Services/OrderService.cs</text>
  <text fill="#ff7b72" font-size="12" x="348" y="122">47</text>
  <text fill="#ff7b72" font-size="12" x="424" y="122">12%</text>
  <text fill="#ff7b72" font-size="12" x="512" y="122">94</text>
  <text fill="#ff7b72" font-size="12" x="586" y="122">Low</text>
  <text fill="#ff7b72" font-size="12" font-weight="600" x="672" y="122">High</text>
  <text fill="#ff7b72" font-size="12" font-weight="600" x="740" y="122">High</text>

  <!-- Row 2: High Priority -->
  <rect fill="#ff7b7208" x="14" y="130" width="872" height="20" rx="2"/>
  <text fill="#ff7b72" font-size="12" x="28" y="144">2</text>
  <text fill="#ff7b72" font-size="12" x="66" y="144">Services/ReportFormatter.cs</text>
  <text fill="#ff7b72" font-size="12" x="348" y="144">22</text>
  <text fill="#ff7b72" font-size="12" x="424" y="144">31%</text>
  <text fill="#ff7b72" font-size="12" x="512" y="144">67</text>
  <text fill="#ff7b72" font-size="12" x="586" y="144">Low</text>
  <text fill="#ff7b72" font-size="12" font-weight="600" x="672" y="144">High</text>
  <text fill="#ff7b72" font-size="12" font-weight="600" x="740" y="144">High</text>

  <!-- ── Next Sprint ── -->
  <text fill="#58a6ff" font-size="12" font-weight="600" x="22" y="168">── Next Sprint</text>
  <line x1="142" y1="164" x2="878" y2="164" stroke="#21262d" stroke-width="1"/>

  <!-- Row 3: Medium Priority, Risk/Coupling independently red -->
  <text fill="#d29922" font-size="12" x="28" y="188">3</text>
  <text fill="#d29922" font-size="12" x="66" y="188">Controllers/PaymentGateway.cs</text>
  <text fill="#d29922" font-size="12" x="348" y="188">31</text>
  <text fill="#d29922" font-size="12" x="424" y="188">8%</text>
  <text fill="#d29922" font-size="12" x="512" y="188">118</text>
  <text fill="#ff7b72" font-size="12" x="586" y="188">Very High</text>
  <text fill="#ff7b72" font-size="12" font-weight="600" x="672" y="188">High</text>
  <text fill="#d29922" font-size="12" font-weight="600" x="740" y="188">Medium</text>

  <!-- ── Monitor ── -->
  <text fill="#58a6ff" font-size="12" font-weight="600" x="22" y="214">── Monitor</text>
  <line x1="108" y1="210" x2="878" y2="210" stroke="#21262d" stroke-width="1"/>

  <!-- Row 4: Low Priority, Risk independently red -->
  <text fill="#484f58" font-size="12" x="28" y="234">4</text>
  <text fill="#484f58" font-size="12" x="66" y="234">Data/LegacyDbSync.cs</text>
  <text fill="#484f58" font-size="12" x="348" y="234">41</text>
  <text fill="#484f58" font-size="12" x="424" y="234">0%</text>
  <text fill="#484f58" font-size="12" x="512" y="234">201</text>
  <text fill="#ff7b72" font-size="12" x="586" y="234">Very High</text>
  <text fill="#ff7b72" font-size="12" font-weight="600" x="672" y="234">High</text>
  <text fill="#484f58" font-size="12" x="740" y="234">Low</text>

  <!-- Separator -->
  <line x1="22" y1="252" x2="878" y2="252" stroke="#21262d" stroke-width="1"/>

  <!-- Summary -->
  <text fill="#8b949e" font-size="11.5" x="22" y="272">4 files analyzed. 2 high-priority (start today), 1 medium-priority (next sprint).</text>
  <text fill="#8b949e" font-size="11.5" x="22" y="290">2 high-risk file(s) need seam introduction before testing.</text>

  <!-- Subtle legend -->
  <text fill="#484f58" font-size="10" x="22" y="316">Risk = churn × coverage gaps × complexity</text>
  <text fill="#484f58" font-size="10" x="340" y="316">Priority = risk adjusted for coupling</text>
</svg>
